<!-- Reusable monochrome watercolor-paper tile. Stitched turbulence supplies
     pigment mottling and fine paper grain; broad translucent washes soften it.
     No embedded imagery, external assets, scripts or colour-specific palette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <filter id="pigment" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.065" numOctaves="4" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.6" intercept="-0.8"/>
        <feFuncG type="linear" slope="2.6" intercept="-0.8"/>
        <feFuncB type="linear" slope="2.6" intercept="-0.8"/>
      </feComponentTransfer>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="384" height="384" filter="url(#pigment)" opacity="0.85"/>
  <rect width="384" height="384" filter="url(#paper)" opacity="0.35"/>
  <g filter="url(#wash)">
    <path d="M35 50 Q75 12 135 42 Q151 85 102 114 Q46 108 35 50Z" fill="white" opacity="0.55"/>
    <path d="M250 280 Q300 250 338 290 Q352 330 310 343 Q254 339 250 280Z" fill="white" opacity="0.4"/>
    <path d="M120 170 Q195 105 275 175 Q264 262 183 258 Q118 243 120 170Z" fill="black" opacity="0.18"/>
  </g>
</svg>
